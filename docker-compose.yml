services:
  db:
    image: postgres:16
    container_name: scribbl-db
    environment:
      POSTGRES_USER: scribbl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scribbl
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribbl -d scribbl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: